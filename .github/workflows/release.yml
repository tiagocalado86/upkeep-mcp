# Publishes to npm when a version tag is pushed.
#
# The package and the repository drift apart the moment publishing is a thing
# someone remembers to do by hand, so it is wired to the tag instead. The gate
# runs again here rather than trusting the tag: a tag can be pushed from a dirty
# tree, and `npm publish` is not reversible.
#
# There is no publish token. npm authenticates this workflow over OIDC, which
# means nothing long-lived to leak, rotate or forget — see
# docs/adr/0014-trusted-publishing-over-a-token.md. One-time setup: name this
# repository and this workflow file as the trusted publisher on the package's
# npm settings page.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The OIDC token npm exchanges for a short-lived credential. Provenance rides
  # on the same identity, so the tarball is tied to the commit it was built from.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still ships 10.x.
      - name: npm new enough to publish over OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # Refuses to publish a tag whose version does not match package.json,
      # which is the mistake this workflow would otherwise automate.
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$packaged" ]; then
            echo "tag $tag does not match package.json version $packaged" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN and no --provenance: OIDC supplies the credential and
      # npm attaches provenance by itself when the publish is a trusted one.
      - name: Publish
        run: npm publish --access public
